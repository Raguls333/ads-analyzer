[build]
  # The directory where the frontend is located
  base = "ui"
  
  # The command Netlify should run to build the app
  command = "npm run build"
  
  # The directory containing the production build
  publish = "dist"

# Redirect for Single Page Application (SPA) routing
# This ensures React Router or similar tools handle all routes correctly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: If you need to proxy API requests to your backend (like Vite's proxy)
# Uncomment and update the URL below to point to your production API
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-production-backend-url.com/api/:splat"
#   status = 200
#   force = true
