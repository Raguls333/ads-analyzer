[build]
  base = "ui"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE = "https://ads-analyzer.onrender.com"

# ---------------------------------------------------------------------------
# Deployment Contexts (Production, Branch Deploys, Deploy Previews)
# ---------------------------------------------------------------------------

# Production Context (main branch)
[context.production.environment]
  NODE_VERSION = "20"
  VITE_API_BASE = "https://ads-analyzer.onrender.com"

# Deploy Previews (triggered automatically on Pull Requests)
[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  NODE_VERSION = "20"
  VITE_API_BASE = "https://ads-analyzer.onrender.com"

# Branch Deploys (e.g. 'dev', 'develop', or 'staging' branches)
[context.branch-deploy]
  command = "npm run build"

[context.branch-deploy.environment]
  NODE_VERSION = "20"
  VITE_API_BASE = "https://ads-analyzer.onrender.com"

# ---------------------------------------------------------------------------
# Redirects & Proxy Rules
# ---------------------------------------------------------------------------

# Proxy /api/* calls directly to the Render backend to prevent CORS issues
[[redirects]]
  from = "/api/*"
  to = "https://ads-analyzer.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page App (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security & Cache Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
