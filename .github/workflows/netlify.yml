name: Netlify CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'ui/**'
      - 'netlify.toml'
      - '.github/workflows/netlify.yml'
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'ui/**'
      - 'netlify.toml'
      - '.github/workflows/netlify.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Build Test
        run: npm run build
        env:
          VITE_API_BASE: https://ads-analyzer.onrender.com

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: ui/dist/
          retention-days: 7

  deploy:
    name: Deploy to Netlify
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: ui/dist

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './ui/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.event.head_commit.message || github.ref_name }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        continue-on-error: true
